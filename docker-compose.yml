# Uso:
#   docker compose up --build            -> levanta todo (http://localhost:8080)
#   docker compose up db                 -> solo PostgreSQL, para desarrollar con runserver
#   docker compose --profile demo up     -> además publica la app con un túnel de Cloudflare
name: oficiopro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde TU computador (para runserver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PRIVATE_MEDIA_ROOT: /app/private_media
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde TU computador (para runserver)
    # Sin puertos publicados: nadie entra directo. Está en "edge" solo para poder
    # SALIR a internet (API de WhatsApp); la base de datos queda solo en "internal".
    networks: [internal, edge]

  #frontend:
